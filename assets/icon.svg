<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1e2e"/>
      <stop offset="100%" stop-color="#11111b"/>
    </linearGradient>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a2b3d"/>
      <stop offset="100%" stop-color="#181825"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#89b4fa"/>
      <stop offset="100%" stop-color="#b4befe"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background container -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>

  <!-- Monitor Stand Base -->
  <path d="M196 416 h120 c8 0 14 6 14 14 v4 c0 6 -4 10 -10 10 H192 c-6 0 -10 -4 -10 -10 v-4 c0 -8 6 -14 14 -14 z" fill="#45475a"/>
  <!-- Monitor Stand Neck -->
  <path d="M242 340 h28 v76 h-28 z" fill="#585b70"/>

  <!-- Monitor Outer Frame -->
  <rect x="76" y="96" width="360" height="248" rx="24" fill="#313244" stroke="#45475a" stroke-width="4"/>

  <!-- Monitor Screen Display -->
  <rect x="96" y="116" width="320" height="208" rx="14" fill="url(#screenGrad)"/>

  <!-- Power Off / Sleep Crescent Moon -->
  <g transform="translate(256, 220)" filter="url(#glow)">
    <!-- Crescent Moon Symbol -->
    <path d="M12 -45 C-18 -45 -42 -21 -42 9 C-42 39 -18 63 12 63 C23 63 33 60 42 54 C26 50 14 36 14 19 C14 0 28 -16 45 -18 C35 -34 24 -45 12 -45 Z" fill="url(#glowGrad)"/>
    <!-- Small Zzz indicator -->
    <path d="M28 -28 H44 L31 -14 H47" stroke="#b4befe" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <path d="M42 -44 H54 L44 -34 H56" stroke="#cdd6f4" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>

  <!-- Monitor Power Indicator LED (Amber/dim) -->
  <circle cx="256" cy="328" r="3" fill="#f9e2af" opacity="0.8"/>
</svg>
